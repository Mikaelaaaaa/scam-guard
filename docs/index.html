<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>這是詐騙嗎 · scam-guard</title>
    <style>
      /* 這個頁面不是 Gradio，所以它自己提供那七個主題變數的值 ——
         判定卡、偵測細節與氣泡的樣式表由 demo_ui.CSS 提供（頁面就緒後注入），
         那份樣式表只引用變數、不含任何色碼。寫死的顏色因此全部集中在下面
         兩個 :root 區塊裡，而深色模式由 prefers-color-scheme 覆寫一次。 */
      :root {
        color-scheme: light dark;
        --body-text-color: #22262c;
        --body-text-color-subdued: #5a6069;
        --background-fill-secondary: #f2f5f9;
        --block-background-fill: #ffffff;
        --border-color-primary: #c6cbd2;
        --color-accent: #2b4c7e;
        --color-accent-soft: #e4ecf7;
        --page-background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --body-text-color: #e6e8ec;
          --body-text-color-subdued: #a3a9b4;
          --background-fill-secondary: #1b1f26;
          --block-background-fill: #13171d;
          --border-color-primary: #39404a;
          --color-accent: #7aa7e0;
          --color-accent-soft: #1e2a3a;
          --page-background: #0d1117;
        }
      }
      body {
        margin: 0;
        padding: 1.5rem 1rem 4rem;
        font-family: system-ui, "Noto Sans TC", sans-serif;
        line-height: 1.75;
        color: var(--body-text-color);
        background: var(--page-background);
      }
      main {
        max-width: 48rem;
        margin: 0 auto;
      }
      .boot,
      .model {
        border: 1px solid var(--border-color-primary);
        border-left: 4px solid var(--color-accent);
        border-radius: 6px;
        padding: 0.6rem 0.9rem;
        margin: 1rem 0;
        background: var(--background-fill-secondary);
      }
      .boot-head {
        font-weight: 700;
      }
      progress {
        display: block;
        width: 100%;
        height: 0.8rem;
        margin: 0.65rem 0;
        accent-color: var(--color-accent);
      }
      .boot-detail,
      .model-detail {
        font-size: 0.82rem;
        color: var(--body-text-color-subdued);
        white-space: pre-wrap;
      }
      .model-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
      }
      label {
        font-size: 0.85rem;
        color: var(--body-text-color-subdued);
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 7rem;
        font: inherit;
        font-size: 0.9rem;
        padding: 0.6rem;
        margin-top: 0.3rem;
        color: var(--body-text-color);
        background: var(--block-background-fill);
        border: 1px solid var(--border-color-primary);
        border-radius: 6px;
      }
      textarea.one-line {
        min-height: 3.5rem;
      }
      button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.3rem 0.75rem;
        border: 1px solid var(--border-color-primary);
        border-radius: 999px;
        background: var(--block-background-fill);
        color: var(--body-text-color);
        cursor: pointer;
      }
      button.primary {
        border-color: var(--color-accent);
        background: var(--color-accent);
        color: var(--page-background);
        border-radius: 8px;
        padding: 0.45rem 1.1rem;
        font-weight: 700;
      }
      button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button[aria-pressed="true"] {
        border-color: var(--color-accent);
        background: var(--color-accent-soft);
        font-weight: 700;
      }
      .chips,
      .modes {
        margin: 0.5rem 0;
      }
      .send-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin: 0.6rem 0 1rem;
      }
      .error {
        border: 1px solid var(--border-color-primary);
        border-left: 4px solid var(--color-accent);
        background: var(--background-fill-secondary);
        border-radius: 6px;
        padding: 0.6rem 0.9rem;
        margin: 1rem 0;
        font-size: 0.82rem;
        white-space: pre-wrap;
        overflow-x: auto;
      }
      #echo,
      #practice-conversation {
        margin-top: 1rem;
      }
      .llm-status,
      .polish-status {
        font-size: 0.82rem;
        color: var(--body-text-color-subdued);
        margin: 0.4rem 0;
        min-height: 1.4rem;
      }
    </style>
    <style id="shared-style"></style>
  </head>
  <body>
    <main>
      <div class="sg-head">
        <h1>這是詐騙嗎</h1>
        <p>
          貼上你收到的可疑訊息，看看它像不像詐騙、依據是什麼，以及你現在可以做什麼。
          判斷全部在你的瀏覽器裡完成，訊息不會送出。
        </p>
      </div>

      <div class="boot" id="boot">
        <div class="boot-head" id="boot-head">正在初始化</div>
        <progress id="entry-progress" value="0" max="100"></progress>
        <div class="boot-detail" id="boot-detail">
          先載入規則層（約 12–14 MB），接著載入語意模型（約 784 MB）。
          模型通常只下載一次，但瀏覽器可能清除快取。
        </div>
      </div>

      <div id="main-app" hidden>
      <div class="modes" id="modes">
        <button id="mode-inquiry" type="button" aria-pressed="true">查詢模式</button>
        <button id="mode-practice" type="button" aria-pressed="false">詐騙對練</button>
      </div>

      <div class="model" id="model" role="status">
        <div class="model-row">
          <b>語意判讀</b>
          <span class="model-detail" id="model-state"></span>
        </div>
        <div class="model-detail" id="model-detail">
          模型由第三方 CDN（huggingface.co）送達；訊息仍只在你的瀏覽器裡處理。
        </div>
      </div>

      <section id="panel-inquiry">
        <div class="analysis-slot" id="card"></div>
        <div class="demo-columns">
        <div class="input-column">
        <label for="input">
          一則就直接貼上；一段轉傳的多則對話請以<b>空行</b>分隔。
        </label>
        <textarea id="input" disabled placeholder="等待執行環境載入完成"></textarea>
        <div class="chips" id="samples"></div>
        <p class="note">這些是示範用的合成範例，用來展示系統怎麼判讀；系統對真實訊息的實際表現見評估報告。</p>
        <div class="send-row">
          <button id="run" class="primary" disabled>看看這是不是詐騙</button>
          <span class="note" id="registered-note"></span>
        </div>
        <div class="llm-status" id="inquiry-llm-status"></div>
        <div id="echo"></div>
        </div>
        <div class="detail-column" id="inquiry-details"></div>
        </div>
      </section>

      <section id="panel-practice" hidden>
        <div class="analysis-slot" id="practice-card"></div>
        <div class="demo-columns">
        <div class="input-column">
        <div id="practice-conversation"></div>
        <label for="practice-input">
          你扮演「邪惡詐騙犯」，一次打一句。「善良市民」說的每一句都只會來自判定結果。
        </label>
        <textarea id="practice-input" class="one-line" disabled
          placeholder="等待執行環境載入完成"></textarea>
        <div class="send-row">
          <button id="practice-run" class="primary" disabled>送出這一輪</button>
        </div>
        <div class="llm-status" id="practice-llm-status"></div>
        <div class="polish-status" id="practice-polish-status"></div>
        </div>
        <div class="detail-column">
        <div id="practice-details"></div>
        <div id="practice-ranking"></div>
        </div>
        </div>
      </section>

      <div id="error" class="error" hidden></div>

      <p class="sg-foot note">你貼的訊息不離開這台電腦；模型由第三方 CDN 取得，你的 IP 會出現在其記錄裡。</p>
      </div>
    </main>

    <script type="module">
      // 這個頁面不經過 Gradio-Lite。原因記在 docs/pages_app.py 的模組 docstring：
      // @gradio/lite 已一年未更新，內建的 Gradio 5.45.0 對上今天的 PyPI 會在啟動
      // 階段連續踩到三個相依性漂移的錯，上游自己的 hello world 也起不來。
      // Pyodide 直接跑則沒有這個問題：scam_guard 的執行期依賴是 []，
      // micropip 不需要向 PyPI 解析任何東西。
      const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v0.29.4/full/pyodide.mjs";
      const WHEEL = "scam_guard-0.1.0-py3-none-any.whl";
      const SAMPLES = "demo_samples.json";
      // demo_ui.py、browser_llm.py 與 pages_app.py 都不在 wheel 裡（pyproject 的
      // packages.find 只收 scam_guard*），三者由 scripts/build_pages.sh 複製到部署
      // 目錄，再由這裡寫進 Pyodide 的檔案系統。少一個檔案會在 pyimport 當場炸，
      // 而建置腳本有一條檢查把它擋在部署之前。
      const MODULES = ["demo_ui.py", "browser_llm.py", "pages_app.py"];

      // ---------------------------------------------------------------------
      // 模型這一層的常數。三者各附取得日期與實際位元組數。
      // ---------------------------------------------------------------------

      // npm 實測：4.2.0 發佈於 2026-04-22，dist-tags.latest。
      // 釘死版本號，MUST NOT 用 @latest —— 理由與釘住模型 sha 相同：
      // 外部資產的版本必須是我們記下來的，不是對方當下給的。
      const TRANSFORMERS = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";
      // HF API 實測（2026-09-15）：gated: false、下載數 1,646、上次更新 2026-03-13。
      const MODEL_REPO = "onnx-community/gemma-3-1b-it-ONNX";
      // revision 是一個 commit sha，不是 "main"：釘住之後 transformers.js 的快取鍵
      // 變成 pathJoin(repo_id, revision, filename)，上游重新上傳不會與本機的舊檔
      // 混在同一個鍵下（src/utils/hub.js 在 revision === 'main' 時才以 URL 當鍵）。
      const MODEL_REVISION = "a58439f40017d3b99c7d378ff525e54e0ba08ebf";
      // 該 revision 下的實際位元組數（HF API ?blobs=true 實測，2026-09-15）：
      //   onnx/model_q4f16.onnx            461,341
      //   onnx/model_q4f16.onnx_data   763,067,904   ← 728.1 MiB，全部 dtype 裡最小
      //   tokenizer.json                20,323,013   ← vocab_size 262,144，不是打錯字
      //   tokenizer_config.json / config.json / generation_config.json /
      //   special_tokens_map.json / chat_template.jinja 合計 6,740
      const MODEL_BYTES = 783858998;
      // dtype 與 device 兩者 MUST 顯式指定。瀏覽器的預設是 device=wasm、dtype=q8，
      // 那條路會下載 1.42 GiB 並在 CPU 上跑 —— 比我們選的路多 762 MB。
      const MODEL_DTYPE = "q4f16";
      const MODEL_DEVICE = "webgpu";
      // embedding 張量在 4-bit 下的大小：262,144 × 1,152 × 0.5 = 150,994,944 bytes。
      // **這是由 config.json 的 vocab_size 與 hidden_size 推算的，不是實測。**
      // Dawn 的 maxStorageBufferBindingSize 階梯最低一階是 134,217,728（128 MiB），
      // 低於這個張量 —— 只有 tier0 的裝置會失敗。
      const MIN_STORAGE_BUFFER = 150994944;
      // 判讀輸出的上界。四個欄位加上 200 字元的 analysis_notes，512 綽綽有餘；
      // 它同時是「模型開始胡言亂語時要付多少成本」的上界。**沒有實測依據。**
      const MAX_NEW_TOKENS = 512;
      const MODEL_INIT_TIMEOUT_MS = 300000;
      // 模型只是加值段；即使 CDN 或瀏覽器的 WebGPU promise 卡住，五分鐘後也必須
      // 放行規則層主畫面。底層下載可能仍在瀏覽器內收尾，但不再能改寫 UI 狀態。

      // 量測用的開關：?prefill=off 關掉助理回合預填，讓「有預填 / 無預填」兩組
      // STRUCTURE 失敗率可以在同一個站台上跑出來。沒有這兩組數字就無從判斷
      // 預填值不值得保留（見 openspec/changes/add-browser-llm/design.md）。
      const USE_PREFILL = new URLSearchParams(location.search).get("prefill") !== "off";

      const at = (path) => new URL(path, new URL(".", location.href)).href;
      const $ = (id) => document.getElementById(id);
      const mib = (bytes) => `${(bytes / 1024 / 1024).toFixed(1)} MiB`;

      const boot = $("boot");
      const bootHead = $("boot-head");
      const bootDetail = $("boot-detail");
      const entryProgress = $("entry-progress");
      const errorBox = $("error");

      const started = performance.now();
      const elapsed = () => ((performance.now() - started) / 1000).toFixed(1);
      let stage = "";
      const ticker = setInterval(() => {
        bootHead.textContent = `正在載入執行環境：${stage}（已等待 ${elapsed()} 秒）`;
      }, 500);

      function stageIs(text) {
        stage = text;
        bootHead.textContent = `正在載入執行環境：${stage}（已等待 ${elapsed()} 秒）`;
      }

      function entryProgressIs(value, text) {
        entryProgress.value = value;
        stageIs(text);
      }

      function bootFailed(reason) {
        clearInterval(ticker);
        bootHead.textContent = "執行環境載入失敗";
        bootDetail.textContent = String(reason);
      }

      function showError(reason) {
        errorBox.textContent = String(reason?.message ?? reason);
        errorBox.hidden = false;
      }

      // 缺檔或欄位不全就 throw 並指名檔名與該筆內容 —— 這些檔案都進版控或由建置
      // 腳本產生，缺少它們代表部署不完整，不是一個正常狀態。
      async function fetchOrThrow(path) {
        const response = await fetch(at(path));
        if (!response.ok) {
          throw new Error(`取不到 ${path}：HTTP ${response.status}`);
        }
        return response;
      }

      const texts = new Map();

      async function loadSamples() {
        const loaded = await (await fetchOrThrow(SAMPLES)).json();
        if (!Array.isArray(loaded.samples)) {
          throw new Error(`${SAMPLES} 缺少 samples 欄位`);
        }
        const chips = $("samples");
        loaded.samples.forEach((sample, index) => {
          for (const field of ["label", "short_label", "text"]) {
            if (!(field in sample)) {
              throw new Error(`${SAMPLES} 的一筆資料缺少 ${field} 欄位`);
            }
          }
          if (texts.has(String(index))) {
            throw new Error(`${SAMPLES} 的索引重複：${index}`);
          }
          texts.set(String(index), sample.text);

          const chip = document.createElement("button");
          chip.type = "button";
          chip.textContent = sample.short_label;
          chip.dataset.sampleIndex = String(index);
          chip.disabled = true;
          chips.appendChild(chip);

        });
      }

      async function boot_python() {
        entryProgressIs(2, "強制段：下載執行環境");
        const { loadPyodide } = await import(PYODIDE);
        const py = await loadPyodide();

        entryProgressIs(5, "強制段：安裝 scam_guard");
        await py.loadPackage("micropip");
        py.globals.set("WHEEL_URL", at(WHEEL));
        // deps=False 是事實不是最佳化：scam_guard 的 dependencies 是 []，
        // 這一行同時保證安裝過程不會對 PyPI 發出任何請求。
        await py.runPythonAsync(
          "import micropip\nawait micropip.install(WHEEL_URL, deps=False)\n"
        );

        entryProgressIs(7, "強制段：載入網域名單快照");
        py.FS.mkdir("/psl");
        for (const name of ["public_suffix_list.dat", "manifest.json"]) {
          const response = await fetchOrThrow(`psl/${name}`);
          py.FS.writeFile(`/psl/${name}`, new Uint8Array(await response.arrayBuffer()));
        }

        // 涉詐網址黑名單與 Tranco 排名白名單，兩份都是建置腳本打包的快照原樣。
        // 黑名單是 gzip 後約 1.2 MB 的十萬筆 JSON Lines，這一段與下面
        // pages_app 的 import 合計約多花 1.6 秒（其中 1.32 秒在
        // BlocklistStore.__init__ 逐筆算可註冊網域，任何打包格式都要付）——
        // 所以它自己有一個階段名稱：一個沒有標籤的一秒半看起來像當掉。
        entryProgressIs(9, "強制段：載入涉詐網址名單");
        for (const directory of ["blocklist", "allowlist"]) {
          py.FS.mkdir(`/${directory}`);
          for (const name of ["entries.jsonl", "manifest.json"]) {
            const response = await fetchOrThrow(`${directory}/${name}`);
            py.FS.writeFile(
              `/${directory}/${name}`,
              new Uint8Array(await response.arrayBuffer())
            );
          }
        }

        // pyimport 是 BlocklistStore.__init__ 真正發生的地方，所以這一段仍然是
        // 最後一個階段 —— 標籤要蓋住最慢的那一步，不是最慢的那一步的前一步。
        entryProgressIs(12, "強制段：建立檢查註冊表");
        for (const name of MODULES) {
          const source = await (await fetchOrThrow(name)).text();
          py.FS.writeFile(`/home/pyodide/${name}`, source);
        }
        return py.pyimport("pages_app");
      }

      // ---------------------------------------------------------------------
      // 模型層。強制段完成後立即嘗試，不提供按鈕或選項。
      // ---------------------------------------------------------------------

      // 四個狀態就是 browser_llm.LlmState 的四個值。它們過界到 Python，
      // 由那一側決定畫面上要顯示哪一段文字（那是 Python 那一側的知識，不是這裡的）。
      const NOT_LOADED = "not_loaded";
      const LOADING = "loading";
      const LOAD_FAILED = "load_failed";
      const READY = "ready";

      const model = {
        state: NOT_LOADED,
        tokenizer: null,
        instance: null,
        // 判讀與 persona 生成**共用同一個實例**：兩份權重會佔一點五 GB 圖形記憶體，
        // 而兩者是序列呼叫的。
      };

      function modelStateIs(text) {
        $("model-state").textContent = text;
      }

      // 三個前提各自檢查、各自回報，而且**在取得任何檔案之前**。
      // MUST NOT 併成一句「你的瀏覽器不支援」：三者指向三種不同的處置。
      async function requireWebGpuAdapter() {
        if (!navigator.gpu) {
          throw new Error(
            "這個瀏覽器沒有 WebGPU（navigator.gpu 不存在），語意判讀這一層跑不起來。" +
              "規則層不受影響。Chrome 113 起支援，Linux 桌機要到 Chrome 144，" +
              "Firefox 與 Safari 的支援時間更晚。"
          );
        }
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          throw new Error(
            "這個瀏覽器有 WebGPU，但 requestAdapter() 沒有取得任何顯示卡。" +
              "通常是顯示卡被列在瀏覽器的封鎖清單裡，或是遠端桌面／虛擬機環境。"
          );
        }
        return adapter;
      }

      function requireShaderF16(adapter) {
        if (!adapter.features.has("shader-f16")) {
          throw new Error(
            "這張顯示卡的 WebGPU 沒有 shader-f16 這項擴充，跑不了 q4f16 這個量化版本。" +
              "這與「沒有 WebGPU」是兩件不同的事：Chrome 的 WebGPU 實作在 Vulkan " +
              "後端的全部 NVIDIA 顯示卡上關閉了這項擴充（Linux / Android），" +
              "所以這台機器有 WebGPU 但這一層仍然用不了。" +
              "這一層因此不載入，也不改用別的後端。"
          );
        }
      }

      function requireStorageBufferSize(adapter) {
        const reported = adapter.limits.maxStorageBufferBindingSize;
        if (reported < MIN_STORAGE_BUFFER) {
          throw new Error(
            `這張顯示卡回報的 maxStorageBufferBindingSize 是 ${reported} bytes` +
              `（${mib(reported)}），小於這個模型最大的那個權重張量所需的 ` +
              `${MIN_STORAGE_BUFFER} bytes（${mib(MIN_STORAGE_BUFFER)}）。` +
              "那是 embedding 張量：262,144 × 1,152 × 0.5，由 config.json 推算。" +
              "瀏覽器為了防指紋會回報分級而非實際的限制值，所以這個數字是階梯上的一階。"
          );
        }
      }

      const progress = new Map();
      let modelInitializationActive = false;

      function reportProgress(event) {
        if (!modelInitializationActive || event.status !== "progress" || !event.total) {
          return;
        }
        progress.set(event.file, event);
        let loaded = 0;
        let total = 0;
        for (const item of progress.values()) {
          loaded += item.loaded;
          total += item.total;
        }
        const fraction = Math.min(1, loaded / total);
        entryProgress.value = 12 + fraction * 88;
        // 分母是實際的 content-length，不是一個估計的百分比，也不是一個沒有終點的
        // 轉圈動畫 —— 使用者要知道的是「還要多久」，而那需要一個分母。
        modelStateIs(`下載中：${loaded} / ${total} bytes（${mib(loaded)} / ${mib(total)}）`);
      }

      async function loadModel(transformers) {
        const options = {
          dtype: MODEL_DTYPE,
          device: MODEL_DEVICE,
          revision: MODEL_REVISION,
          progress_callback: reportProgress,
        };
        const tokenizer = await transformers.AutoTokenizer.from_pretrained(MODEL_REPO, {
          revision: MODEL_REVISION,
          progress_callback: reportProgress,
        });
        const instance = await transformers.AutoModelForCausalLM.from_pretrained(
          MODEL_REPO,
          options
        );
        return { tokenizer, instance };
      }

      async function prepareModel() {
        // 先驗證硬體再下載 transformers.js 與模型；不支援的瀏覽器不發出多餘請求。
        const adapter = await requireWebGpuAdapter();
        requireShaderF16(adapter);
        requireStorageBufferSize(adapter);
        const transformers = await import(TRANSFORMERS);
        const loaded = await loadModel(transformers);
        return { transformers, ...loaded };
      }

      async function initializeModel() {
        model.state = LOADING;
        modelInitializationActive = true;
        modelStateIs("正在建立模型");
        let timeoutId;
        const timeout = new Promise((resolve, reject) => {
          timeoutId = setTimeout(
            () => reject(new Error("語意模型初始化超過五分鐘，已停止等待")),
            MODEL_INIT_TIMEOUT_MS
          );
        });
        try {
          modelStateIs(
            `正在載入 ${MODEL_BYTES} bytes（約 784 MB）的語意模型；通常只下載一次。`
          );
          const loaded = await Promise.race([prepareModel(), timeout]);
          clearTimeout(timeoutId);
          modelInitializationActive = false;
          transformersModule = loaded.transformers;
          model.tokenizer = loaded.tokenizer;
          model.instance = loaded.instance;
          model.state = READY;
          modelStateIs("語意判讀已開啟。下一次送出的判定會多一層語意判讀。");
          entryProgress.value = 100;
          entryProgress.dataset.state = "ready";
          return true;
        } catch (reason) {
          clearTimeout(timeoutId);
          modelInitializationActive = false;
          // 失敗原文上畫面，MUST NOT 改寫成一句泛用的「模型載入失敗」——
          // 三個前提失敗的處置各不相同，而泛用訊息把那個差別擦掉了。
          model.state = LOAD_FAILED;
          const message = String(reason?.message ?? reason);
          modelStateIs(`這個瀏覽器不支援語意判讀或模型載入失敗：${message}`);
          entryProgress.dataset.state = "failed";
          bootHead.textContent = "語意判讀無法初始化，已直接使用規則層";
          bootDetail.textContent = message;
          return false;
        }
      }

      // ---------------------------------------------------------------------
      // 生成。一次判讀一次生成，**驗證失敗不重試**。
      // ---------------------------------------------------------------------

      // 預填前綴由 Python 側依 scam_guard.llm.schema.FIELD_NAMES 產生後過界 ——
      // 這裡不手寫任何欄位名，也不寫任何 ScamType 或 label 的值。
      // 這一側沒有文法約束解碼（transformers.js 的 14 個 logits processor 沒有一個
      // 是文法或 JSON schema 約束），所以結構保證退回「產生後驗證」，
      // 而那份驗證在 scam_guard.llm.validate，一個字元都不在這裡。
      let constants = null;

      async function generate(messages, { prefill, streamer, criteria, maxNewTokens }) {
        const text =
          model.tokenizer.apply_chat_template(messages, {
            add_generation_prompt: true,
            tokenize: false,
          }) + prefill;
        const inputs = model.tokenizer(text, { add_special_tokens: false });
        const output = await model.instance.generate({
          ...inputs,
          // 決定性設定，且沒有任何依驗證結果調整它的路徑：提高溫度以增加通過驗證的
          // 機會等於為了讓輸出通過檢查而讓判定更隨機。
          do_sample: false,
          max_new_tokens: maxNewTokens,
          streamer,
          stopping_criteria: criteria,
        });
        const generated = model.tokenizer.batch_decode(
          output.slice(null, [inputs.input_ids.dims.at(-1), null]),
          { skip_special_tokens: true }
        )[0];
        return generated;
      }

      async function readingGeneration(prompt) {
        const transformers = await transformersModule;
        const criteria = new transformers.InterruptableStoppingCriteria();
        const timer = setTimeout(() => criteria.interrupt(), constants.deadline_s * 1000);
        try {
          const prefill = USE_PREFILL ? constants.prefill : "";
          const generated = await generate([{ role: "user", content: prompt }], {
            prefill,
            criteria,
            maxNewTokens: MAX_NEW_TOKENS,
          });
          if (criteria.interrupted) {
            // 逾時以既有的哨符表達，讓 LlmOutcomeCounter 記到 TIMEOUT。
            // MUST NOT 以一段截斷的輸出代替 —— 那會被記成 STRUCTURE，
            // 而那是另一件事的名字。
            return constants.timeout_sentinel;
          }
          // 「預填前綴 + 生成內容」逐字元串接，不 strip、不補括號、不做任何修補。
          return prefill + generated;
        } finally {
          clearTimeout(timer);
        }
      }

      // ---------------------------------------------------------------------
      // 一次判讀 = 兩趟同步的 Python 呼叫，中間夾一段非同步生成
      // ---------------------------------------------------------------------

      let app = null;
      let transformersModule = null;

      function renderResult(rendered, panelId, detailsId) {
        const template = document.createElement("template");
        template.innerHTML = rendered;
        const panel = template.content.querySelector(".analysis-panel");
        const details = template.content.querySelector(".detection-detail");
        if (!panel || !details) {
          throw new Error("判定結果缺少分析面板或偵測細節");
        }
        $(panelId).replaceChildren(panel);
        $(detailsId).replaceChildren(details);
      }

      function renderInquiryFirst(first) {
        renderResult(first.card, "card", "inquiry-details");
        $("echo").innerHTML = first.echo;
        $("inquiry-llm-status").textContent = first.status;
      }

      let inquiryBusy = false;

      function setInquiryBusy(busy) {
        inquiryBusy = busy;
        $("run").disabled = busy;
        $("input").disabled = busy;
        $("mode-inquiry").disabled = busy;
        $("mode-practice").disabled = busy;
        for (const button of $("samples").querySelectorAll("button")) {
          button.disabled = busy;
        }
      }

      async function analyze(text) {
        if (inquiryBusy) {
          return;
        }
        setInquiryBusy(true);
        try {
          errorBox.hidden = true;
          let first;
          try {
            first = JSON.parse(app.inquiry_first(text, model.state));
          } catch (reason) {
            // Python 的例外原文直接放上畫面：輸入為空、座標算錯、檢查回報了無法
            // 分類的狀態，各自的訊息都已經指名了是哪一件事。
            showError(reason);
            return;
          }
          renderInquiryFirst(first);

          // 判定卡已經在畫面上了。下面這一段可以慢，慢不影響上面那一張卡。
          try {
            const second =
              model.state === READY && first.prompt
                ? JSON.parse(app.inquiry_second(first.token, await readingGeneration(first.prompt)))
                : JSON.parse(app.inquiry_without_model(first.token, model.state));
            renderResult(second.card, "card", "inquiry-details");
            if (second.status) {
              $("inquiry-llm-status").textContent = second.status;
            }
          } catch (reason) {
            showError(reason);
          }
        } finally {
          setInquiryBusy(false);
        }
      }

      // ---------------------------------------------------------------------
      // 對練模式。一輪的順序就是這個函式的順序，而順序是 requirement。
      // ---------------------------------------------------------------------

      function renderPractice(payload) {
        if ("card" in payload) {
          renderResult(payload.card, "practice-card", "practice-details");
        }
        if ("ranking" in payload) {
          $("practice-ranking").innerHTML = payload.ranking;
        }
        if ("conversation" in payload) {
          $("practice-conversation").innerHTML = payload.conversation;
        }
        if (payload.status) {
          $("practice-llm-status").textContent = payload.status;
        }
        if ("polish_status" in payload) {
          $("practice-polish-status").textContent = payload.polish_status;
        }
      }

      let practiceBusy = false;

      function setPracticeBusy(busy) {
        practiceBusy = busy;
        $("practice-run").disabled = busy;
        $("practice-input").disabled = busy;
        $("mode-inquiry").disabled = busy;
        $("mode-practice").disabled = busy;
      }

      async function polish(systemPrompt, prompt) {
        const transformers = await transformersModule;
        const criteria = new transformers.InterruptableStoppingCriteria();
        let aborted = false;
        const streamer = new transformers.TextStreamer(model.tokenizer, {
          skip_prompt: true,
          skip_special_tokens: true,
          callback_function: (chunk) => {
            if (aborted || !chunk) {
              return;
            }
            // 每收到一塊就同步呼叫 Python 的驗證器。回 false 就立刻中止生成 ——
            // 三條條件都是前綴可判定的，等全文產生完才驗證代表使用者已經看過了。
            const step = JSON.parse(app.practice_polish_feed(chunk));
            renderPractice(step);
            if (!step.ok) {
              aborted = true;
              criteria.interrupt();
            }
          },
        });
        // persona 回應是自由文字：不帶預填、不帶結構約束，並與判讀共用模型實例。
        try {
          await generate(
            [
              { role: "system", content: systemPrompt },
              { role: "user", content: prompt },
            ],
            { prefill: "", streamer, criteria, maxNewTokens: 128 }
          );
        } catch (reason) {
          if (!aborted) {
            renderPractice(JSON.parse(app.practice_polish_fail()));
          }
          throw reason;
        }
        if (!aborted) {
          renderPractice(JSON.parse(app.practice_polish_end()));
        }
      }

      async function practiceRound(text) {
        if (practiceBusy) {
          return;
        }
        setPracticeBusy(true);
        try {
          errorBox.hidden = true;
          let first;
          try {
            first = JSON.parse(app.practice_first(text, model.state));
          } catch (reason) {
            showError(reason);
            return;
          }
          // 1. 規則層那一趟：判定卡與排行立刻上畫面，**還沒有受害方台詞**。
          renderPractice(first);

          try {
            // 2 與 3. 判讀生成，然後含 LlmCheck 的那一趟 —— 卡片與排行再更新一次，
            //    而受害方台詞取自**這一趟**的 Verdict。
            const second =
              model.state === READY && first.prompt
                ? JSON.parse(app.practice_second(first.token, await readingGeneration(first.prompt)))
                : JSON.parse(app.practice_without_model(first.token, model.state));
            renderPractice(second);

            // 4. persona 生成。模型沒開時不發生，畫面保留確定性底稿。
            if (model.state === READY) {
              await polish(second.polish_system, second.polish_prompt);
            }
          } catch (reason) {
            showError(reason);
          }
        } finally {
          setPracticeBusy(false);
        }
      }

      // ---------------------------------------------------------------------
      // 版面
      // ---------------------------------------------------------------------

      function switchMode(mode) {
        const inquiry = mode === "inquiry";
        $("panel-inquiry").hidden = !inquiry;
        $("panel-practice").hidden = inquiry;
        $("mode-inquiry").setAttribute("aria-pressed", String(inquiry));
        $("mode-practice").setAttribute("aria-pressed", String(!inquiry));
      }

      try {
        await loadSamples();
        app = await boot_python();
        // 樣式表與標記同源：這個頁面只提供調色盤，class 的規則一份都不自己寫。
        $("shared-style").textContent = app.styles();
        constants = JSON.parse(app.constants());
        $("registered-note").textContent = `已檢查 ${app.check_count()} 個訊號`;

        const input = $("input");
        const run = $("run");
        const practiceInput = $("practice-input");
        const practiceRun = $("practice-run");
        input.disabled = false;
        input.placeholder = "把你收到的訊息貼在這裡";
        practiceInput.disabled = false;
        practiceInput.placeholder = "打一句詐騙方會說的話";
        run.disabled = false;
        practiceRun.disabled = false;

        entryProgressIs(13, "加值段：載入語意判讀元件");
        const modelReady = await initializeModel();
        clearInterval(ticker);
        $("main-app").hidden = false;
        if (modelReady) {
          boot.hidden = true;
        }

        run.addEventListener("click", () => analyze(input.value));
        practiceRun.addEventListener("click", () => {
          const text = practiceInput.value;
          practiceInput.value = "";
          practiceRound(text);
        });
        $("mode-inquiry").addEventListener("click", () => switchMode("inquiry"));
        $("mode-practice").addEventListener("click", () => switchMode("practice"));

        // 一個委派的 handler 讀 dataset，不為每顆按鈕各捕獲一份索引。
        $("samples").addEventListener("click", (event) => {
          const chip = event.target.closest("button[data-sample-index]");
          if (!chip) {
            return;
          }
          const text = texts.get(chip.dataset.sampleIndex);
          if (text === undefined) {
            throw new Error(`範例庫中沒有這個索引：${chip.dataset.sampleIndex}`);
          }
          input.value = text;
          analyze(text);
        });
        for (const chip of $("samples").querySelectorAll("button")) {
          chip.disabled = false;
        }
      } catch (reason) {
        bootFailed(reason.message ?? reason);
      }
    </script>
  </body>
</html>
