[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scam-guard"
version = "0.1.0"
description = "台灣中文詐騙訊息偵測"
requires-python = ">=3.11"
# 此 change 不引入任何執行期依賴。
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# 選配的 NLP 個資辨識路徑，只供 `pii_nlp/` 使用，`scam_guard/` 不得 import
# （由下方的 banned-api 強制）。未安裝此 extra 時偵測核心照常運作 ——
# 那不是靠 try/except，是靠核心的 import 圖裡根本沒有這個節點。
#
# ⚠️ 此 extra **目前裝不到 design 想要的東西**，記在這裡而不是只記在 design：
# PyPI 的 `privacy-filter`（0.1.0，top-level import 名 `privacy_filter`，已實際
# 安裝驗證）是第三方對**基礎模型** `openai/privacy-filter` 的包裝，走 HuggingFace
# `pipeline()`；design 要的是 `lianghsun/privacy-filter-tw` 加上 `opf` CLI，
# 而 `opf` 在 PyPI 上不存在。詳見 `add-pii-recognizers/design.md` 的
# 「`opf` CLI 契約驗證結果」。
pii-nlp = [
    "privacy-filter",
]

# 介面層的執行期依賴。`pip install scam-guard` 不會裝到它 ——
# `scam_guard/` 的 `dependencies` 維持 `[]`。
demo = [
    "gradio>=6.0",
]

[tool.setuptools.packages.find]
include = ["scam_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "TID"]

# 架構界線：scam_guard/ 偵測核心不得 import 介面層模組。
# Python 沒有 Go 的循環 import 保護，此處以 lint 規則補上。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"gradio".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，Gradio 相關程式碼請放在 app.py"
"fastapi".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，HTTP 層請放在 api/"
"linebot".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，LINE 相關程式碼請放在 adapters/"
"telegram".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，Telegram 相關程式碼請放在 adapters/"
# 網路 I/O 的界線。scam_guard/ 是偵測核心（純函式、讀本機檔案），不得發出網路請求：
# 部署前取得資料放 tools/，請求路徑上的對外查詢放 net/。
#
# 這條規則只看**直接的 import 敘述**。`importlib.import_module("socket")` 繞得過去，
# subprocess 叫 curl 也繞得過去 —— 這是提醒機制不是沙箱。它擋的是手滑
# （趕時間時直接寫 `import requests`），不是擋惡意。
"urllib.request".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"requests".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"httpx".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"urllib.error".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"http.client".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"socket".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"ftplib".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"smtplib".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"aiohttp".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"

# 選配 NLP 個資辨識的界線。登記的是**實際的 top-level import 名稱**
# （`privacy_filter`，PyPI 發佈名為 `privacy-filter`，兩者不同），
# 已以 `pip install` 後 `import privacy_filter` 驗證 ——
# banned-api 登記錯名稱等於沒有界線，而且是那種寫在設定檔裡看起來很有效的沒有界線。
"privacy_filter".msg = "架構界線違規：privacy-filter 為選配依賴，不得在 scam_guard/ 內 import，請放在 pii_nlp/"

# 介面層自身當然要 import 介面層模組，豁免之。新增介面層目錄時須同步更新此清單。
[tool.ruff.lint.per-file-ignores]
"api/*" = ["TID251"]
"adapters/*" = ["TID251"]
"app.py" = ["TID251"]
# tools/ 在部署前由人執行一次，產物是一份本機快照；net/ 在每次請求中執行。
# 兩者都做網路 I/O，豁免上方的網路函式庫禁令 —— 但**不可合併成一個目錄**：
# 合併之後「tools/ 是離線的」就不再成立，而沒有任何機制會報告這件事。
"tools/*" = ["TID251"]
"net/*" = ["TID251"]
# 測試要建構網路例外的實例（`socket.gaierror` 等）才能驗證 net/ 把它們正確
# 歸成 UNAVAILABLE。被保護的對象是 scam_guard/，測試不是它的一部分 ——
# 而「scam_guard/ 有沒有 import 網路函式庫」另有一個掃描原始碼的測試守著，
# 不依賴這條 lint 規則。
"tests/*" = ["TID251"]
# pii_nlp/ 是選配 NLP 套件的唯一容身處，與 api/、adapters/ 同層。
"pii_nlp/*" = ["TID251"]

# 對照表（TLD 風險、短網址、品牌）是人工整理的內容，必須進版控並隨套件安裝。
# 少了這一段，`pip install .`（非 `-e`）之後檔案不存在 —— 而這種錯在可編輯安裝下
# 不會出現，只在正式安裝時出現。
[tool.setuptools.package-data]
"scam_guard.tables" = ["*.json"]
