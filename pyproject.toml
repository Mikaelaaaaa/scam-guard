[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scam-guard"
version = "0.1.0"
description = "台灣中文詐騙訊息偵測"
requires-python = ">=3.11"
# 此 change 不引入任何執行期依賴。
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["scam_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "TID"]

# 架構界線：scam_guard/ 偵測核心不得 import 介面層模組。
# Python 沒有 Go 的循環 import 保護，此處以 lint 規則補上。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"gradio".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，Gradio 相關程式碼請放在 app.py"
"fastapi".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，HTTP 層請放在 api/"
"linebot".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，LINE 相關程式碼請放在 adapters/"
"telegram".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，Telegram 相關程式碼請放在 adapters/"
# 網路 I/O 的界線。scam_guard/ 是偵測核心（純函式、讀本機檔案），對外取資料一律
# 放在 tools/。擋的是最順手的三個入口，擋不住 socket、http.client 或 subprocess
# 叫 curl —— 這是提醒機制不是沙箱，繞過它需要刻意。
"urllib.request".msg = "架構界線違規：scam_guard/ 不做 I/O，網路取得請放在 tools/"
"requests".msg = "架構界線違規：scam_guard/ 不做 I/O，網路取得請放在 tools/"
"httpx".msg = "架構界線違規：scam_guard/ 不做 I/O，網路取得請放在 tools/"

# 介面層自身當然要 import 介面層模組，豁免之。新增介面層目錄時須同步更新此清單。
[tool.ruff.lint.per-file-ignores]
"api/*" = ["TID251"]
"adapters/*" = ["TID251"]
"app.py" = ["TID251"]
# tools/ 是網路 I/O 的唯一容身處，豁免上方的 urllib.request / requests / httpx。
"tools/*" = ["TID251"]

# 對照表（TLD 風險、短網址、品牌）是人工整理的內容，必須進版控並隨套件安裝。
# 少了這一段，`pip install .`（非 `-e`）之後檔案不存在 —— 而這種錯在可編輯安裝下
# 不會出現，只在正式安裝時出現。
[tool.setuptools.package-data]
"scam_guard.tables" = ["*.json"]
