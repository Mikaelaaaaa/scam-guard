[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scam-guard"
version = "0.1.0"
description = "台灣中文詐騙訊息偵測"
requires-python = ">=3.11"
# 此 change 不引入任何執行期依賴。
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# 選配的 NLP 個資辨識路徑，只供 `pii_nlp/` 使用，`scam_guard/` 不得 import
# （由下方的 banned-api 強制）。未安裝此 extra 時偵測核心照常運作 ——
# 那不是靠 try/except，是靠核心的 import 圖裡根本沒有這個節點。
#
# ⚠️ 此 extra **目前裝不到 design 想要的東西**，記在這裡而不是只記在 design：
# PyPI 的 `privacy-filter`（0.1.0，top-level import 名 `privacy_filter`，已實際
# 安裝驗證）是第三方對**基礎模型** `openai/privacy-filter` 的包裝，走 HuggingFace
# `pipeline()`；design 要的是 `lianghsun/privacy-filter-tw` 加上 `opf` CLI，
# 而 `opf` 在 PyPI 上不存在。詳見 `add-pii-recognizers/design.md` 的
# 「`opf` CLI 契約驗證結果」。
pii-nlp = [
    "privacy-filter",
]

# 介面層的執行期依賴。`pip install scam-guard` 不會裝到它 ——
# `scam_guard/` 的 `dependencies` 維持 `[]`。
demo = [
    "gradio>=6.0",
]

# HTTP 介面層的執行期依賴。與 `demo` 同性質：`pip install scam-guard` 不會裝到
# 它，`scam_guard/` 的 `dependencies` 維持 `[]`，而 `banned-api` 擋住核心 import
# `fastapi`。pydantic 雖然是 fastapi 的必要依賴，仍顯式列出 ——
# `api/schema.py` 直接 `import pydantic`，而依賴一個只是碰巧被裝進來的套件，
# 在上游改用別的驗證層時會安靜地壞掉。
api = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    # 跑起來需要一個 ASGI server，fastapi 不含它。
    "uvicorn>=0.30",
]

# LINE webhook adapter（clients/line/）。與 api 同一套（fastapi + ASGI server）——
# 驗簽與 Gemini 呼叫都用標準庫的 hmac / urllib，不需 line-bot-sdk。
line = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# LLM 層的執行期依賴。`scam_guard/` 的 `dependencies` 維持 `[]` ——
# 核心只產生 prompt 與 grammar 這兩段字串，推論引擎的實際呼叫在 `llm_runtime/`，
# 而核心的 import 圖裡沒有那個節點，所以未安裝此 extra 時零個 `try: import`。
#
# ⚠️ PyPI 上的 `llama-cpp-python` 0.3.35 **只有 sdist**（74.9 MB），`pip install`
# 會在安裝時編譯 C++。作者維護的預編譯 wheel index 是
# `https://abetlen.github.io/llama-cpp-python/whl/cpu`，安裝指令要帶
# `--extra-index-url`；那是一個第三方託管的 GitHub Pages，掛掉時安裝會落回編譯。
llm = [
    "llama-cpp-python>=0.3.35",
    "huggingface-hub>=0.26",
]

# 評估側（`tools/eval/`）的依賴。測試集的建立、Wilson 區間、混淆矩陣、
# 門檻掃描與消融全部只用標準庫 —— `math.sqrt` 與 `collections.Counter` 已足夠，
# 一個常數不值得一個依賴（本專案已為此拒絕過 PyYAML、tldextract 與拼音函式庫）。
#
# 唯一的例外是 `tools/eval/baseline_tfidf.py` 的 TF-IDF 對照組，它是一個
# **刻意不屬於本系統**的外部基準：規則系統值不值得做，要有一個不需要規則、
# 不需要依據、1 秒訓練完的東西來比。`scam_guard/` 不 import 它、不知道它存在，
# 由 `tests/test_baseline_tfidf.py` 的一條掃描 import 的測試守著。
eval = [
    "scikit-learn>=1.4",
    # 對話 ham 語料的繁簡轉換。**來源條件式**：working corpus
    # `Gossiping-Chinese-Corpus` 是原生台灣繁中，MUST NOT 轉換；OpenCC 只在啟用
    # 簡體備援（CrossWOZ / KdConv）時才以 `s2twp` 全量轉繁。列於此處是宣告備援
    # 路徑的依賴，與 `scikit-learn` 同性質：只在 `tools/`，`scam_guard/` 不 import，
    # 由 `tests/test_baseline_tfidf.py` 的掃描測試守著。
    "opencc>=1.1",
]

[tool.setuptools.packages.find]
include = ["scam_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "TID"]

# 架構界線：scam_guard/ 偵測核心不得 import 介面層模組。
# Python 沒有 Go 的循環 import 保護，此處以 lint 規則補上。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"gradio".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，Gradio 相關程式碼請放在 app.py"
"fastapi".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，HTTP 層請放在 api/"
"linebot".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，LINE 相關程式碼請放在 adapters/"
"telegram".msg = "架構界線違規：介面層模組不得在 scam_guard/ 內 import，Telegram 相關程式碼請放在 adapters/"
# 網路 I/O 的界線。scam_guard/ 是偵測核心（純函式、讀本機檔案），不得發出網路請求：
# 部署前取得資料放 tools/，請求路徑上的對外查詢放 net/。
#
# 這條規則只看**直接的 import 敘述**。`importlib.import_module("socket")` 繞得過去，
# subprocess 叫 curl 也繞得過去 —— 這是提醒機制不是沙箱。它擋的是手滑
# （趕時間時直接寫 `import requests`），不是擋惡意。
"urllib.request".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"requests".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"httpx".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"urllib.error".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"http.client".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"socket".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"ftplib".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"smtplib".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"
"aiohttp".msg = "架構界線違規：scam_guard/ 不得發出網路請求，取得請放 tools/、請求路徑上的查詢請放 net/"

# 選配 NLP 個資辨識的界線。登記的是**實際的 top-level import 名稱**
# （`privacy_filter`，PyPI 發佈名為 `privacy-filter`，兩者不同），
# 已以 `pip install` 後 `import privacy_filter` 驗證 ——
# banned-api 登記錯名稱等於沒有界線，而且是那種寫在設定檔裡看起來很有效的沒有界線。
"privacy_filter".msg = "架構界線違規：privacy-filter 為選配依賴，不得在 scam_guard/ 內 import，請放在 pii_nlp/"

# LLM runtime 與模型下載的界線。登記的是**實際的 top-level import 名稱**
# （`llama_cpp`、`huggingface_hub`；PyPI 發佈名為 `llama-cpp-python`、
# `huggingface-hub`，與 import 名不同），已以實際安裝後 import 驗證。
# 偵測核心只定義 `LlmRuntime` 這個 Protocol，實作在頂層的 `llm_runtime/` ——
# 核心的 import 圖裡沒有那個節點，所以未安裝 `llm` extra 時核心的 import
# 不可能失敗，系統中也因此不需要任何 `try: import`。
"llama_cpp".msg = "架構界線違規：偵測核心不得 import 推論引擎，請放在 llm_runtime/"
"huggingface_hub".msg = "架構界線違規：偵測核心不得 import 模型倉庫下載函式庫，請放在 llm_runtime/"

# 介面層自身當然要 import 介面層模組，豁免之。新增介面層目錄時須同步更新此清單。
[tool.ruff.lint.per-file-ignores]
"api/*" = ["TID251"]
"adapters/*" = ["TID251"]
"app.py" = ["TID251"]
# tools/ 在部署前由人執行一次，產物是一份本機快照；net/ 在每次請求中執行。
# 兩者都做網路 I/O，豁免上方的網路函式庫禁令 —— 但**不可合併成一個目錄**：
# 合併之後「tools/ 是離線的」就不再成立，而沒有任何機制會報告這件事。
"tools/*" = ["TID251"]
"net/*" = ["TID251"]
# 測試要建構網路例外的實例（`socket.gaierror` 等）才能驗證 net/ 把它們正確
# 歸成 UNAVAILABLE。被保護的對象是 scam_guard/，測試不是它的一部分 ——
# 而「scam_guard/ 有沒有 import 網路函式庫」另有一個掃描原始碼的測試守著，
# 不依賴這條 lint 規則。
"tests/*" = ["TID251"]
# pii_nlp/ 是選配 NLP 套件的唯一容身處，與 api/、adapters/ 同層。
"pii_nlp/*" = ["TID251"]
# llm_runtime/ 是推論引擎的唯一容身處，與 net/、pii_nlp/、api/ 同層。
# 不叫 `llm/`：核心側已經有 `scam_guard/llm/`，兩個同名的套件在 import 敘述裡
# 看起來一樣（`from llm import ...` vs `from scam_guard.llm import ...`）。
"llm_runtime/*" = ["TID251"]

# 對照表（TLD 風險、短網址、品牌）是人工整理的內容，必須進版控並隨套件安裝。
# 少了這一段，`pip install .`（非 `-e`）之後檔案不存在 —— 而這種錯在可編輯安裝下
# 不會出現，只在正式安裝時出現。
[tool.setuptools.package-data]
"scam_guard.tables" = ["*.json", "*.toml"]
