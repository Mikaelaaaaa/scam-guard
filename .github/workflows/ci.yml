name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 必須含 demo extra：`tests/test_gradio_demo.py` 以 `importorskip("gradio")`
      # 開頭，少了它整個檔案會被安靜跳過，而 skipped 不會讓 CI 變紅。
      - name: Install
        run: pip install -e ".[dev,demo]"

      - name: Lint
        run: ruff check .

      # 退出碼 5 表示沒有收集到任何測試，此階段視為通過。
      - name: Test
        run: pytest || [ $? -eq 5 ]
