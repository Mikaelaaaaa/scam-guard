# ══ LLM 語意判讀（2 條）═══════════════════════════════════════════════
#
# hard_capable = false 是**單調升級的條件 B**，不是一個排版上的選擇：
# hard 的定義是「存在一個可陳述的事實，使合法機構或正常使用者不可能送出這個
# 言語行為」，而模型的判讀是**推論**不是事實。載入層對「宣告 hard_capable = false
# 卻回報 hard=True」拋例外，所以這條有一道自動的交叉檢查。
#
# 兩個連帶後果都是我們要的：LLM 不可能觸發短路（要 hit and hard），
# 也不可能把信心的基準值拉到 base_hard 那一級。
#
# 條件 A 在程式碼（validate.py：label 為最低級時回傳空陣列），
# 條件 C 在上方的 [roles]（三個角色的值都不是這兩個名稱 —— 若 LLM 擔任
# quotation 角色，它就能觸發 contradicted 而使系統拒答，那是一條**降低風險**
# 的路徑，而單調升級禁止那種路徑）。

