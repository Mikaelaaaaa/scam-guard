# ══ 門檻 ══════════════════════════════════════════════════════════════
#
# scoring 相關的全部常數集中於此，MUST NOT 於程式碼中出現任何未登錄的判定門檻。
# 每條 MUST 含 value 與 basis；basis = "placeholder" 時 MUST 附 rationale
# （此值是從什麼推出來的）與 blocked_on（哪個 change 會取代它）。
# 門檻沒有「繼承自某個既有佔位值」這回事，所以此處不要求 inherited_from，
# 也不限制值必須落在權重的允許集合內 —— 門檻的單位雖與權重相同，
# 但機率與行數這類門檻根本不在那個尺度上。

[thresholds]
# 此區段在 add-weight-table 落地時為空骨架，由
# add-score-compute、add-confidence、add-verdict-render 各自填入。

# ══ 類型優先序 ════════════════════════════════════════════════════════
#
# 供 add-type-resolve 在 hard 與權重皆平手時取用。順序依 165 各 CaseTitle
# 的件數降序。件數不是「這個類型比較重要」，它是「在台灣比較常發生」——
# 這是唯一一個我們手上真的有數字的排序依據，而任何其他順序
# （Enum 定義順序、字典序、候選出現順序）都是在假裝有依據。
#
# 兩個合併成員的件數為其涵蓋的兩個 CaseTitle 之和：
#   INSTALLMENT_CANCEL = 1589 + 997 = 2586
#   ORDER_ANOMALY      =  839 + 266 = 1105
# 這使本清單的順序與 ScamType 的定義順序**不同**（INSTALLMENT_CANCEL 2586
# 排在 GUESS_WHO 2227 之前），而那正是「不是 Enum 順序」的可觀察證據。

