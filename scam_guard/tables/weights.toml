group = "llm_semantic"
hard_capable = false
[signal.weight_soft]
value = 0.6
basis = "placeholder"
inherited_from = "add-speech-act-rules 的 Tier-B 佔位值；由 add-llm-validate 登錄"
blocked_on = "add-testset"

