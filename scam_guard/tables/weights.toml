# 訊號權重表 —— 全系統訊號的單一真相來源。
#
# 權重的尺度是**對數似然比**：
#
#     w(訊號) = ln( P(訊號命中 | 詐騙) / P(訊號命中 | 合法) )
#
# 這不是任意選的尺度，它決定了下游怎麼算。若訊號條件獨立，後驗對數勝算等於
# 先驗對數勝算加上各訊號的 w 之和 —— 也就是 `add-score-compute` 的加權求和。
# **求和之所以合法，唯一的理由就是權重是對數似然比。** 若權重是「重要性分數」
# 之類的東西，相加沒有意義，只是把兩個沒有單位的數字放在一起。
#
# 同一個定義說明了「同群組取 max」在補什麼：相加假設條件獨立，而同群組的訊號
# 明顯不獨立。一則假檢警訊息同時命中 safe_account、atm_operation、secrecy_demand，
# 不是三個獨立證據，是**一段腳本**。取 max 是承認不獨立之後最保守的處置。
#
# ── 每個權重條目 MUST 宣告 basis ─────────────────────────────────────────
#
# basis = "measured"    MUST 附 p_hit_given_scam、p_hit_given_ham、measured_on；
#                       兩個機率 MUST 落在開區間 (0, 1)；
#                       value MUST 等於 ln(p_scam / p_ham)，容差 0.01
# basis = "placeholder" MUST NOT 附任何條件機率（附了就拋例外）；
#                       MUST 附 inherited_from 與 blocked_on；
#                       value MUST 屬於 {2.5, 0.6, 0.0, -1.5}
#
# 這使「編出 33 個有差異的數字」在載入時就失敗：想寫 1.9 就必須標成 measured，
# 而 measured 必須附兩個機率，而兩個機率必須算得出那個 1.9。
# **沒有一條路可以在沒有量測的情況下產生一個新數字。**
#
# 允許集合的四個值各有出處：
#   2.5   add-speech-act-rules 的 Tier-A 佔位值
#   0.6   add-speech-act-rules 的 Tier-B 佔位值（亦為自帶碼豁免的降級值）
#   -1.5  add-quotation-check 的引述負權重
#   0.0   url_shortener 的「宣告資訊不足」
#
# ── 分群 ──────────────────────────────────────────────────────────────
#
# 每個訊號 MUST 宣告 group。**預設每個訊號自成一組。** 兩個訊號同群組的判準是
# 「存在一則真實訊息，其中的單一事實會同時使兩者命中」，合併 MUST 在
# [group_rationale] 中寫出那個單一事實是什麼。預設合併會讓人為了看起來整齊
# 把不相干的訊號塞進同一群，而每一次錯誤的合併都是在**丟棄證據**。

[roles]
# 計分層、信心層與類型判定層用**角色**認出特殊訊號，不硬編碼字串、
# 不 import pipeline（會成環）或 rules/（會依賴某一條規則存在）。
# 載入時驗證每個值都是表中存在的訊號名稱；與
# `pipeline.QUOTATION_CHECK` / `RELATIONSHIP_RULE` 的一致性由測試斷言。
quotation = "quotation"
relationship = "relationship_building"
blocklist_exact = "url_blocklist"

[group_rationale]
# 非單元群組 MUST 在此說明「哪一個單一事實會使群組內的訊號同時命中」。
# 單元群組不需要，也不應該出現在這裡。
authority_script = "一段假檢警腳本。宣導文複述這段腳本時四條會一起命中，而那是一段複述不是四個證據"
credential_solicit = "一次「把可直接冒名使用的憑證交出來」的索取；同一則訊息索取驗證碼與卡號是同一件事"
advance_fee = "一次「先付一筆才能拿到」的要求；add-speech-act-rules 已點名 prepay_to_receive 與 romance_pretext 重疊"
too_good_offer = "一個不合理的報酬承諾"
url_reputation = "一個連結不可信；add-url-check 的 Impact 已寫明五者同群組，取 max 避免重複計數"
evasion = "一次規避行為。零寬字元與全形半形混用常是同一次操作留下的兩個痕跡"
llm_semantic = "一次語意判讀。一次呼叫只會產出 llm_scam 或 llm_suspicious 其中之一，同群組讓重複計數在結構上也不可能。⚠️ 兩條目前必然同值，那是 PLACEHOLDER_WEIGHTS 這個封閉集合的直接後果不是判斷：2.5 是硬證據強度、0.0 的語意是資訊不足、-1.5 是負的，可用的只剩 0.6。後果是在 add-testset 有實測之前，label 的三級在計分上只有兩級（有訊號 / 無訊號）"

