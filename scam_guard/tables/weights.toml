# ══ 門檻 ══════════════════════════════════════════════════════════════
#
# scoring 相關的全部常數集中於此，MUST NOT 於程式碼中出現任何未登錄的判定門檻。
# 每條 MUST 含 value 與 basis；basis = "placeholder" 時 MUST 附 rationale
# （此值是從什麼推出來的）與 blocked_on（哪個 change 會取代它）。
# 門檻沒有「繼承自某個既有佔位值」這回事，所以此處不要求 inherited_from，
# 也不限制值必須落在權重的允許集合內 —— 門檻的單位雖與權重相同，
# 但機率與行數這類門檻根本不在那個尺度上。

[thresholds]
# 此區段的骨架由 add-weight-table 建立，條目由
# add-score-compute、add-confidence、add-verdict-render 各自填入。

[thresholds.ngram_threshold]
value = 0.376648
basis = "measured"
p_hit_given_scam = 0.846154
p_hit_given_ham = 0.009709
measured_on = "testset/manifest.json 的 tune 切分（572 則 scam、824 則 ham；門檻亦在同一切分選定）"

# ── add-score-compute ──
[thresholds.prior_log_odds]
value = 0.0
basis = "placeholder"
rationale = "不用母體基本率：本系統的輸入是使用者主動拿來查的訊息，那是一個高度篩選過的分布；方法比較實驗的 970 則是平衡取樣，設計上就不含基本率資訊。先驗一旦非 0，「完全無訊號」的輸出就不是 0.5"
blocked_on = "add-metrics"

[thresholds.sigmoid_offset]
value = 0.0
basis = "placeholder"
rationale = "尚未校準，位移為 0 使分數 0 對應機率 0.5。它是一個參數而不是寫死的 0，因為 add-metrics 的校準可能移動它"
blocked_on = "add-metrics"

[thresholds.sigmoid_temperature]
value = 1.0
basis = "placeholder"
rationale = "尚未校準。Platt scaling 的單參數形式就是調溫度，add-metrics 若切得出校準集，調的就是它與 sigmoid_offset"
blocked_on = "add-metrics"

[thresholds.decision_score]
value = 1.5
basis = "placeholder"
rationale = "約束為「單一 measured 弱訊號不跨過門檻、單一 measured 硬證據跨過門檻」。measured 弱訊號權重的下界為 ngram_classifier 的 4.467675，沒有任何 weight_hard 條目量得出 measured（全部 hard_capable 訊號在 tune 上的硬命中數為 0），區間不可滿足，故 decision_score 維持 1.5、不挑一個數字。這代表在此語料上規則層幾乎不產生硬證據，門檻無法由量測重新錨定"
blocked_on = "add-metrics"

# ── add-confidence ──
#
# 八個數字的**相對關係**是設計，絕對值不是。六條關係各有一條測試鎖住：
#   base_no_hit < confidence_floor        完全無訊號必定拒答
#   base_single_group < confidence_floor  單一弱訊號必定拒答
#   base_hard > confidence_floor          硬證據必定給出判定，除非有上限生效
#   cap_contradiction < confidence_floor  矛盾必定拒答
#   cap_unseen_pattern < confidence_floor 說不出類型必定拒答
#   cap_truncated > confidence_floor      截斷不單獨造成拒答
# 數字改了關係還在，測試就還有意義。

[thresholds.base_hard]
value = 0.90
basis = "placeholder"
rationale = "hard 的定義是「存在一個可陳述的事實，使合法機構或正常使用者不可能送出這個言語行為」。有這種事實就有依據，因此高於地板"
blocked_on = "add-metrics"

[thresholds.base_multi_group]
value = 0.55
basis = "placeholder"
rationale = "兩個獨立群組指向同一個結論，比一個群組有依據，因此高於地板但低於硬證據"
blocked_on = "add-metrics"

[thresholds.base_single_group]
value = 0.35
basis = "placeholder"
rationale = "刻意低於地板：一條 Tier-B（「高薪日結免經驗」「保證獲利」）在合法的打工與理財廣告裡大量出現，單一弱訊號不足以下判斷。代價是棄權率提高，而棄權率 MUST 與誤判率一同報告"
blocked_on = "add-metrics"

[thresholds.base_no_hit]
value = 0.05
basis = "placeholder"
rationale = "project.md：「完全無訊號時可能性為 0.5 但信心接近 0」。低於地板，所以無訊號必定拒答"
blocked_on = "add-metrics"

[thresholds.cap_contradiction]
value = 0.30
basis = "placeholder"
rationale = "低於地板，所以矛盾成立即拒答。這是宣導文處置的落地點 —— 有證據但證據對立，系統有東西可看卻沒有依據下判斷"
blocked_on = "add-metrics"

[thresholds.cap_unseen_pattern]
value = 0.35
basis = "placeholder"
rationale = "低於地板：說不出是哪一種詐騙時，scam_type 為 None 配上一個高機率數字對使用者沒有任何可執行的東西，依據也只能是「訊息中有拆字痕跡」這種沒有指向的陳述"
blocked_on = "add-metrics"

[thresholds.cap_truncated]
value = 0.50
basis = "placeholder"
rationale = "高於地板：截斷降低信心但不單獨造成拒答。截斷只在超過 100 則或 50,000 字元時發生，而保留下來的是**最新**的一段，也就是最可能含關鍵行為的一段，把它當成單獨的拒答理由過重"
blocked_on = "add-testset"

# ── add-verdict-render ──

[thresholds.max_evidence_lines]
value = 5
basis = "placeholder"
rationale = "Verdict.checks 會膨脹到 30 筆以上，而一則假檢警訊息可能有 6 到 8 筆命中。五行沒有實測依據，只是一個起點；被截掉的部分仍完整保留在 Verdict.checks 裡"
blocked_on = "clients"

[thresholds.max_actions]
value = 3
basis = "placeholder"
rationale = "建議多到讀不完等於沒有建議。三條沒有實測依據，且可讀性只能由實際介面驗證"
blocked_on = "clients"

[thresholds.confidence_floor]
value = 0.40
basis = "placeholder"
rationale = "低於此值 scam_probability 為 None。取值使四個基準值與三個上限落在上方六條關係所要求的兩側；0.40 本身在 0.35 與 0.50 之間沒有特別之處"
blocked_on = "add-metrics"

# ══ 類型優先序 ════════════════════════════════════════════════════════
#
# 供 add-type-resolve 在 hard 與權重皆平手時取用。順序依 165 各 CaseTitle
# 的件數降序。件數不是「這個類型比較重要」，它是「在台灣比較常發生」——
# 這是唯一一個我們手上真的有數字的排序依據，而任何其他順序
# （Enum 定義順序、字典序、候選出現順序）都是在假裝有依據。
#
# 兩個合併成員的件數為其涵蓋的兩個 CaseTitle 之和：
#   INSTALLMENT_CANCEL = 1589 + 997 = 2586
#   ORDER_ANOMALY      =  839 + 266 = 1105
# 這使本清單的順序與 ScamType 的定義順序**不同**（INSTALLMENT_CANCEL 2586
# 排在 GUESS_WHO 2227 之前），而那正是「不是 Enum 順序」的可觀察證據。

